# lane_only.py 专用标定（main.chassis.cli.lane_only 读，--config 可换路径）。
# 换场地改这里，代码不动。

# 脚本动作 maneuvers（按 distance_m 递增执行）：
#   到 DIST 停转弯逻辑 → 转 TURN（度，负=顺时针/正=逆时针，里程计 θ 增量闭环）
#   → 直行 STRAIGHT（米，可选，缺省 0，里程计盲走）
#   → 视觉对齐拉直 ALIGN（米，可选，缺省 0：vy 锁死 + ω 视觉对齐沿车道前进，
#     转完后车头对齐车道再恢复转弯逻辑，防偏头误判弯）。
#   空列表 [] = 关掉脚本动作；整个段缺省 = 回退代码里 _DEFAULT_MANEUVERS。
maneuvers:
  - distance_m: 1.35
    turn_deg: -42        # 顺时针 42°
    straight_m: 0.0
    align_m: 0.4         # 转完视觉对齐拉直 0.4m
  - distance_m: 16.0
    turn_deg: -120       # 顺时针 120°
    straight_m: 0.0
    align_m: 0.4         # 转完视觉对齐拉直 0.4m

# 弯道视觉转弯（巡线段随时可能遇弯）：CurveDetector 识别 → StaircaseTurn
# 阶梯 θ 闭环 45→90→120°。所有参数从这读，缺字段用类默认值。
# 换场地调这里，别改代码。
turn:
  detector:                  # CurveDetector（弯道识别）
    tol_deg: 20              # 识别阈值 (deg)：|error_angle| 持续超过才判弯；急弯降阈值
    sustain: 5               # 连续帧数（50Hz 下 5 帧=0.1s 去抖）
    sign_cal: 1              # error_angle→转向 符号标定，实车转反了改 -1
    rearm_clean: 0           # 触发后需连续干净直道帧数才允许再触发（0=不冷却）
  staircase:                 # StaircaseTurn（阶梯转弯）
    targets_deg: [45, 90, 120]    # 阶梯目标角度（弯角未知时逐档抬升）
    tol_deg: 2.0                   # 里程碑容忍（|θ_target-θ| 此内=已到档）
    straight_tol_deg: 6.0          # 出口判定：|error_angle| 在此内=已回正
    straight_tol_y_m: 0.05         # 出口判定：error_y 居中容忍
    min_align_rot_deg: 5.0         # 至少转这么多才做出口判定
    # 加固转弯（弯口紧接着十字路口时用，防假 lane 提前结束转弯）：
    #   设 exit_window_deg + exit_sustain + escalate_sustain 后，出口只信贴近
    #   里程碑的停顿窗 + 连续帧。配合顶层 crossroad_turn 指定第几个弯启用。
    #   None = 原版单帧判定。
    exit_window_deg: null
    exit_sustain: 1
    escalate_sustain: 1
    kd_alpha: 0.0                # 内部 OdomTurnPID 的 D 低通，>0 才生效

# 加固转弯：指定第几个弯（从 1 起）用加固转弯逻辑（里程碑窗口出口 + 触发后冷却），
# 其余弯走原版单帧判定。0 / None / 删掉 = 全部原版单帧判定。
crossroad_turn: 0
