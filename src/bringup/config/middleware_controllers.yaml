# middleware_controllers.yaml — 中间层 ros2_control 控制器配置 (2026-08-09).
# Spec: docs/superpowers/specs/2026-08-09-midlayer-ros2control-cartesian-design.md §9
#
# 需要 Orin 安装: ros-humble-ros2-control ros-humble-ros2-controllers
#                 ros-humble-kinematics-interface ros-humble-realtime-tools

controller_manager:
  ros__parameters:
    update_rate: 50
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# 麦克纳姆底盘 (Humble mecanum_drive_controller, generate_parameter_library 版)
# 几何: Lx=0.15 Ly=0.10 wheel_radius=0.03 (与 full_system launch 一致)
mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.9
    front_left_wheel_joint: wheel_m2_joint
    front_right_wheel_joint: wheel_m1_joint
    back_right_wheel_joint: wheel_m4_joint
    back_left_wheel_joint: wheel_m3_joint
    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.03
      sum_of_robot_center_projection_on_X_Y_axis: 0.25   # Lx + Ly
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    publish_odom_twist: true

# 机械臂标准关节轨迹 (关节名 = URDF 名, 与 MC602HardwareInterface 对齐)
joint_trajectory_controller:
  ros__parameters:
    joints: [arm_horiz_joint, arm_vert_joint, arm_hand_rotate_joint, arm_hand_grip_joint]
    command_interfaces: [position]
    state_interfaces: [position]
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - name: wheel_m1_joint
      - name: wheel_m2_joint
      - name: wheel_m3_joint
      - name: wheel_m4_joint
      - name: arm_horiz_joint
      - name: arm_vert_joint
      - name: arm_hand_rotate_joint
      - name: arm_hand_grip_joint
