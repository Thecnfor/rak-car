[project]
name = "rak-car"
version = "0.1.0"
description = "Baidu Smartcar agriculture mission runtime and clients"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "pyudev>=0.24,<1.0",
  "filterpy>=1.4,<2.0",
  "pyzmq>=26,<28",
  "requests>=2.31,<3.0",
  "websocket-client>=1.8,<2.0",
  "textual>=8,<9",
  "rich>=13,<15",
  "PyYAML>=6,<7",
  "pyserial>=3.5",
]

[tool.uv]
package = false
exclude-newer = "7 days"
