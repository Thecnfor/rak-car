task_cfg:

  auto_seeding:
    _doc: |
      任务一:auto_seeding 自动移苗 (2026-08-02 重写)。
              三圆柱 (cylinder_1=大 / cylinder_2=中 / cylinder_3=小) 从右侧 S 列
              抓到左侧 T 列 (cam2 视觉: 源头按 label, 目的地按 marker_label 识别)。
              cam2 每列视野只看 1 个目标, 因此无 x 排序; S_i ↔ T_i 配对同列,
              视觉伺服用吸嘴 setpoint (origin.nozzle_offset_x_norm/y_norm)。
              抓取协议 2026-08-01: y 降到 0 → 验证到位 → 吸 (suck);
              释放协议 2026-08-01: y 降到 0 → drop_object。
              检测/复位姿态 X=-100mm, 大臂=-90°, 手爪=0°, Y=-100mm;
              运输高度 Y=-150mm; 投放姿态 X=-270mm, 大臂=+90°, Y=-30mm.

    marker_label: cylinder_set    # 左侧种植孔的目标检测 label (用户约定 2026-08-02)
    pick_align: true               # 视觉伺服对齐 (基准位后人工摆目标, 量 setpoint)
    place_align: true
    source_position_order: [1, 2, 3]   # 按底盘列路径走 S1→S2→S3
    target_slot_map:                 # label → 摆到的种植槽 (模型识别 + 路由, 一对一)
      cylinder_1: 1
      cylinder_2: 2
      cylinder_3: 3

    spacing_along_row_m: 0.15

    arm_pick_pose:
      x_mm: 0               # 标定基准位 (x=0 = 最右, 与 nozzle_offset 标定对齐)
      arm_angle_deg: -90
      y_mm: -10             # 下放高度(吸取)
      hand_angle_deg: 0     # 吸取时末端向下

    arm_carry_pose:
      x_mm: 0
      arm_angle_deg: -90
      y_mm: -150            # 安全高度
      hand_angle_deg: -10

    arm_place_pose_T2:
      x_mm: -270
      arm_angle_deg: 90     # 大臂指向左侧
      y_mm: -30             # 下放高度(释放)
      hand_angle_deg: -10

    arm_return_S1_pose:
      x_mm: 0
      arm_angle_deg: -90
      y_mm: -100            # 放置后抬到检测高度，直接可下一轮检测
      hand_angle_deg: -10

    init_y_mm: -100        # 初始化抬升高度(进入任务时)

    v_max_arm_lateral_mms: 60

    vacuum_settle_s: 0.5

    chassis_move_timeout_s: 30

  water_tower_task:
    _doc: |
      任务二：水塔取水
      左侧水立方（3 组 × 2 个），右侧 2 个水塔（间隔 60cm）
      Y: 0=底，负=上
      大臂: +90 = MID(init)，-90 = 抓取侧
      末端: -90 = UP(init)，0 = DOWN

    source_position_order: [1, 2]

    tower_spacing_m: 0.65
    group_forward_m: 0.32

    init_pose:
      y_mm: -150
      x_mm: 0
      arm_angle_deg: 90
      hand_angle_deg: -90

    detection_pose:
      x_mm: -240
      arm_angle_deg: -95
      hand_angle_deg: -60
      y_mm: -20

    first_cube_x_mm: -155
    second_cube_x_mm: -265

    pick_pose:
      y_transition_mm: -120
      y_descend_mm: -75
      y_lift_mm: -150
      arm_angle_deg: 95
      hand_angle_deg: 0

    carry_pose:
      x_mm: -105
      arm_angle_deg: -95
      hand_angle_deg: -90

    v_max_arm_x_mms: 80

    vacuum_settle_s: 0.5
    chassis_move_timeout_s: 30

# 8 任务 + 1 终点 waypoint 编排配置 (main.start.orchestrator 用).
# 触发条件: IR (红外接近) + dis_at_least_m (累计里程计) AND/OR.
# 换场地改这里, 业务代码不动.
waypoints:

  # ----- task1 -----
  - name: task1_seeding
    task_id: 1
    task_module: main.task.task1_seeding
    ir_threshold_m: 0.6
    ir_side: right
    dis_at_least_m: 0.90
    trigger_op: AND

  # ----- task3 (TODO) -----
  - name: task3_pest_scout
    task_id: 3
    task_module: main.task.task3_pest_scout
    ir_threshold_m: 1.50
    ir_side: right
    dis_at_least_m: 2.33
    trigger_op: AND

  # ----- task2 -----
  - name: task2_water_tower
    task_id: 2
    task_module: main.task.task2_water_tower
    ir_threshold_m: 0.50
    ir_side: left
    dis_at_least_m: 7
    trigger_op: AND

  # ----- task4 -----
  - name: task4_harvest
    task_id: 4
    task_module: main.task.task4_harvest
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 9.00
    trigger_op: AND

  # ----- task5 -----
  - name: task5_sort
    task_id: 5
    task_module: main.task.task5_sort
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 11.0
    trigger_op: AND

  # ----- task6 -----
  - name: task6_get_order
    task_id: 6
    task_module: main.task.task6_get_order
    ir_threshold_m: 0.50
    ir_side: left
    dis_at_least_m: 13.0
    trigger_op: AND

  # ----- task7 (TODO) -----
  - name: task7_deliver
    task_id: 7
    task_module: main.task.task7_deliver
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 14.5
    trigger_op: AND

  # ----- finish -----
  - name: cruise_done
    task_module: null
    ir_threshold_m: null
    dis_at_least_m: 16.5
    is_finish: true
