task_cfg:

  auto_seeding:
    _doc: |
      ???: ??(????)??? 3 ????????????,
              ?? label ?????????????
              ??? 4 ??: ?? X / ?? Y / ???? / ????,? Z ??,
              ????????,???????

    source_position_order: [1, 2, 3]

    target_slot_map:
      cylinder_3: 1
      cylinder_2: 2
      cylinder_1: 3

    spacing_along_row_m: 0.15

    cyl:
      cylinder_3: { diam_m: 0.10, height_m: 0.06 }
      cylinder_2: { diam_m: 0.08, height_m: 0.06 }
      cylinder_1: { diam_m: 0.06, height_m: 0.06 }

    car_to_cylinder_horizontal_m: 0.22

    nozzle_offset_from_camera:
      height_up_cm: 5
      forward_cm: 2

    fx_effective_px: 430
    d1_camera_cm_formula: "3440 / w_pixel"

    arm_pick_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -10            # 下放高度(吸取)
      hand_angle_deg: 0    # 吸取时末端向下

    arm_carry_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -150           # 安全高度
      hand_angle_deg: -10

    arm_place_pose_T2:
      x_mm: -270
      arm_angle_deg: 90    # 大臂指向左侧
      y_mm: -30            # 下放高度(释放)
      hand_angle_deg: -10

    arm_return_S1_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -100           # 放置后抬到检测高度
      hand_angle_deg: -10

    init_y_mm: -100        # 初始化抬升高度(进入任务时)

    v_max_arm_lateral_mms: 80

    vacuum_settle_s: 0.5
    no_pressure_feedback: true

    chassis_longitudinal_step_m: 0.15
    chassis_move_timeout_s: 30

  water_tower_task:
    _doc: |
      任务二：水塔取水
      左侧水立方（3 组 × 2 个），右侧 2 个水塔（间隔 60cm）
      Y: 0=底，负=上
      大臂: +90 = MID(init)，-90 = 抓取侧
      末端: -90 = UP(init)，0 = DOWN

    source_position_order: [1, 2]

    tower_spacing_m: 0.65
    group_forward_m: 0.32

    init_pose:
      y_mm: -150
      x_mm: 0
      arm_angle_deg: 90
      hand_angle_deg: -90

    detection_pose:
      x_mm: -240
      arm_angle_deg: -95
      hand_angle_deg: -60
      y_mm: -20

    first_cube_x_mm: -155
    second_cube_x_mm: -265

    pick_pose:
      y_transition_mm: -120
      y_descend_mm: -75
      y_lift_mm: -150
      arm_angle_deg: 95
      hand_angle_deg: 0

    carry_pose:
      x_mm: -105
      arm_angle_deg: -95
      hand_angle_deg: -90

    v_max_arm_x_mms: 80

    vacuum_settle_s: 0.5
    chassis_move_timeout_s: 30
