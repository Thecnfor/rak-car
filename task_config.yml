# ?????? -- ????????????
# ?????????? + config_car.yml ?????,???????
#
# ??????:
#   ??? x_mm: ?????=0(??),??=??,?????? [0, 340]
#   ??? y_mm: ??=0,y<0 ??,y>0 ??,?????? [-soft_y_max, 0]
#   ????:   0 deg = MID(init),-150 deg = ??,???? [0, -150]
#   ????:   -90 deg = UP(init),0 deg = DOWN,???? [-90, 0]
#   ??:       ??????? = +x_m,?? = +y_m
#
# ???????:
#   - ?????????????(S1=????, S2=15cm ?, S3=? 15cm)
#   - ?? label ??????????(cylinder_3->T1, cylinder_2->T2, cylinder_1->T3)
#   - T2 = ?? 0 deg + X=-270mm; T1 = ???? 15cm; T3 = ???? 15cm
#   - ??? Y=-150mm,?? X=-60mm->-270mm ?? 60mm/s
#   - ??? Y=-40mm,???? -10 deg (??)

task_cfg:

  auto_seeding:
    _doc: |
      任务一:auto_seeding 自动移苗。
              右侧 S1/S2/S3 三个育苗筒 → 左侧 T1/T2/T3 三个种植槽。
              通过 cam2 视觉标签识别映射 (target_slot_map), 按 S1→S2→S3 顺序逐棵移栽。
              检测/复位姿态 X=-100mm, 大臂=-90°, 手爪=0°, Y=-100mm;
              抓取姿态 X=-100mm, Y=-10mm (大臂转 -90°+Y 下降);
              运输高度 Y=-150mm; 投放姿态 X=-270mm, 大臂=+90°, Y=-30mm.

    source_position_order: [1, 2, 3]

    target_slot_map:
      cylinder_3: 1
      cylinder_2: 2
      cylinder_1: 3

    spacing_along_row_m: 0.15

    arm_pick_pose:
      x_mm: -70            # 2026-08-09: -80 → -70 (S 姿态 x 前移, 与 S_POSE_X_MM 一致)
      arm_angle_deg: -95   # 2026-08-10: -90 → -95 (用户: S 姿态/视觉对齐起始大臂角)
      y_mm: 0              # 2026-08-02: 吸取动作位置 (吸嘴触底)
      hand_angle_deg: 0    # 吸取时末端向下

    arm_carry_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -100           # 上下输送时的中间高度 (现在 main loop 已不单独走, 留字段向后兼容)
      hand_angle_deg: -15

    arm_place_pose_T2:
      arm_angle_deg: 90    # 大臂指向左侧
      y_mm: 0              # 真到 y=0 释放, 通过临时 hand=-90 (UP) 绕开安全门
      hand_angle_deg: 0     # 用户: pick/place 手爪都该是 0 (place 临时变 -90 是为解锁 y=0)

    arm_return_S1_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -100           # 回 S 姿态高度
      hand_angle_deg: -10

    init_y_mm: -100        # 初始化抬升高度 (扫描/伺服的起始高度)

    v_max_arm_lateral_mms: 100   # 2026-08-02 21:51 用户: x 轴速度 0.1 m/s

    vacuum_settle_s: 0.5

    chassis_move_timeout_s: 30

    # 2026-08-02: pick 前视觉对齐底盘 (用户自己写 _chassis_align_by_area,
    # 用 set_chassis_velocity 经 IK, 不像 VisualAlignRunner 那样旋转).
    chassis_align:
      enabled: true         # 启用 — 经 IK 的 set_chassis_velocity 路径
      ref_area: 1.10        # 2026-08-02 实测 PLACE 姿态 / x=-270 / 距离 T 列约 30cm: cylinder_set bbox area ≈ 1.12
      label: null           # auto
      v_max: 0.20
      max_seconds: 5.0      # 2026-08-09: 8.0 → 5.0 (对齐超时收紧, 最坏等待 2×5+1.2s)

    # 2026-08-09: 任务点触发后 step0 — lane follow 前移 0.1m @ 0.1m/s,
    # 与机械臂切 PLACE 姿态 (arm=+90 x=-300 y=-100 hand=0) 并发 (进入任务点就动臂).
    trigger_settle:
      enabled: true
      lane_follow_m: 0.1
      lane_speed_mps: 0.1

    # 2026-08-09: 抓苗视觉伺服传输开关 (同 task2/task6 pick_vision):
    #   local_servo=true  → 新传输 (runtime 进程内 run_arm_servo, main 只发一次目标)
    #   local_servo=false → 旧方式 (网络每帧 track_velocity_pick)
    #   增益/死区/速度等仍走 task1_seeding.py 的 PICK_SERVO_* 常量, 这里只放开关+超时.
    pick_vision:
      local_servo: true
      timeout: 4.0          # 视觉对齐超时秒 (→ run_arm_servo servo_timeout, 同 pick_track_timeout_s 默认)

  water_tower_task:
    _doc: |
      任务二：水塔取水
      左侧水立方（3 组 × 2 个），右侧 2 个水塔（间隔 60cm）
      Y: 0=底，负=上
      大臂: +90 = MID(init)，-90 = 抓取侧
      末端: -90 = UP(init)，0 = DOWN

    source_position_order: [1, 2]

    tower_spacing_m: 0.55       # 2026-08-08: 0.35 → 0.55 (前进到第二座塔改 move_for 直推 0.55m)
    group_forward_m: 0.35        # 2026-08-06: 0.33 → 0.35 (tower 1 前向组间距); 2026-08-06: 0.35 → 0.37
    group_backward_m: 0.33       # 2026-08-06: tower 2 后向用 0.33 (3 块回退距离, 不走 0.35)

    # 2026-08-09: 进入任务点的入口回退 — 原 orchestrator waypoint.back_off_m(0.2m) 挪到这里,
    # 在 task2 init 里与臂切 detection 姿态**并发** (进入任务点就开始动 X, 跟底盘移动一起).
    entry_back_off_m: 0.2

    # cam2 未识别到水塔等级标 → 底盘前移重试 (2026-08-03 用户规定: 前进 0.1m 再 cam2 检测)
    detect_retry_step_m: 0.10    # 2026-08-09: 0.15 → 0.10 (cam2 未识别到等级标 → 底盘前移重试)
    detect_retry_max: 2

    init_pose:
      y_mm: -150
      x_mm: 0
      arm_angle_deg: 90
      hand_angle_deg: -90

    detection_pose:
      x_mm: -200                # 2026-08-04: -240 → -200 (init X 起始位置)
      arm_angle_deg: -96        # 2026-08-08: -92 → -96 (检测大臂; carry 仍 -92)
      hand_angle_deg: -60
      y_mm: -10                 # 2026-08-06: -20 → -10 (抬高 10mm, 看清等级标)

    first_cube_x_mm: -165
    # 2026-08-09: 第二块 X 从 -210 改 -240 (用户实测摆放位置).
    # 识别/视觉对齐前姿态 X 由 cube_x_mm 决定, 见 _pick_cube.init_x_mm.
    second_cube_x_mm: -240
    # 2026-08-10: 每座塔第 1 块转动大臂时的安全 X (通用安全区 [-300,-200] 的 clamp 值
    # -200 → -185)。仅影响第 1 块转臂阶段, 抓取 X 仍走 first_cube_x_mm。
    first_cube_safe_x_mm: -185

    # cam2 视觉闭环: 底盘对齐到水塔等级标 (track_chassis 参数)
    track_align:
      target: "water"            # 等级标 group (water_l1/l2/l3 全家)
      # 2026-08-04 实测: 底盘真对齐时 cam2 看到的 water 等级标在 (0.345, 0.243),
      # 不是画面中心. 这是 cam2 相对车体中线的安装偏移. 闭环要让 chassis 把
      # 等级标拉到这一点, 而不是 (0,0). 5 帧 x 锁死 0.3453, y 在 0.242~0.244 抖动.
      setpoint_cxcy: [0.142, 0.183]  # 2026-08-08: 重测 (大臂 -96° 后) → (cx=0.142, cy=0.183)
      # 2026-08-06 试开 vy 横移闭环 (车不在道中央时让 track_chassis 自纠横向)
      vx_only: true                # 2026-08-06: 关闭 vy, 只让底盘前后调
      # 轴符号: -1/+1 是 2026-08-02 cylinder 标定值。水塔实测方向反了 →
      #   前后反 (该进反退) 改 sign_vx=+1; 左右反 (该左反右) 改 sign_vy=-1
      # 2026-08-03 实测: 前后反 → sign_vx=+1; 横向未观测 (vx_only 后不控 vy, sign_vy 不生效)
      sign_vx: +1
      sign_vy: +1
      # 2026-08-03 实测 "移动太急" → 全面调缓: kp 0.50→0.30, v_max 0.25→0.15,
      # 新增 v_slew 每帧速度变化限幅 0.015 (~0.3 m/s², 比默认 0.02 更缓防急冲/急停)
      kp: 0.22
      v_max: 0.11
      v_slew: 0.011
      hz: 25.0                      # 2026-08-06: 控制频率 20→25 Hz (40ms/帧, task_feed 上限)
      deadband: 0.02                # 2026-08-09: 0.03 → 0.02 (水塔对齐死区再收紧)
      hold_frames: 6                # 2026-08-08: 4→6 (锁死帧数更严)
      max_lost_frames: 30
      max_seconds: 5.0          # 2026-08-09: 6.0 → 5.0 (底盘对齐时间)

    # 同一水塔内第 1/2/3 块的投放 Y 深度梯度 (避免堆叠碰撞)
    # 2026-08-06: -40/-60/-80 → -10/-55/-75 → 0/-50/-75 → 0/-45/-70 → -10/-45/-75 (用户新规定)
    # 2026-08-09: 第 3 块 Y -75 → -80, 手爪 -90 → -85 (用户新规定)
    deliver_y_by_index: [-10, -45, -80]
    deliver_hand_by_index: [-80, -85, -85]
    # 2026-08-09: 投放 X 分水塔 (用户规定: 塔1=-80, 塔2=-90), 按 tower_idx 取值.
    # 缺省回退 carry_pose.x_mm (-90).
    carry_x_by_tower_mm: [-80, -90]

    pick_pose:
      # 2026-08-04: 抓取 init 姿态 (S 形态, 视觉伺服起点).
      # 实测: 在 x=-150, y=-150, arm=90, hand=-10 姿态下,
      # cam2 看到水方块 bbox 中心 (0.0875, -0.236) — 5 帧锁死.
      # 这是 "吸嘴正对水方块" 时的 cam2 标定点, 即 setpoint_cxcy.
      # 注: 视觉伺服起始 X 由 cube_x_mm 决定 (per-cube), 见 _pick_cube.init_x_mm.
      # pick_pose 不再单独定义 x_mm, 走 first_cube_x_mm / second_cube_x_mm.
      y_transition_mm: -150       # 视觉伺服起始 Y (运输高度)
      y_descend_mm: -50           # 吸附高度 (2026-08-04: -75 → -50, 抓时更贴方块)
      y_lift_mm: -140             # 抬升高度 (2026-08-08: 抓取后(-75)直接升到 -140 去投递, 不再去 -150; -120→-140)
      arm_angle_deg: 90           # 大臂角度 (init / 抓取同)
      hand_angle_deg: -10         # 手爪角度 (轻微前倾, 让 cam2 看到吸嘴下方)

    # cam2 视觉伺服抓水立方 (2026-08-03):
    #   手爪转 0° → cam2 识别水立方 → 视觉定位到吸嘴正下方 → move_y 到吸附高度 → 吸附 → 抬回.
    #   走 ArmRunner.track_velocity_pick (velocity 模式, 免 arm_queue), 与 task1 相同机制.
    #   方向符号默认沿用 task1 (arm= -90°) 标定值; 任务二大臂在 +95° 抓取, 方向可能反,
    #   实车若"越对越偏"把 sign_arm / sign_x 取反.
    #   arm_min/arm_max 是大臂增量微调的范围 (task1 默认 [-150, 90], 任务二必须覆盖到 +95°).
    #   enabled: false → 退回盲抓 (fixed 姿态 move_y + grasp, 无视觉).
    pick_vision:
      enabled: true
      # 2026-08-09: true=闭环下沉 (runtime 进程内视觉伺服, main 只发目标参数, 无每帧网络)
      local_servo: true
      label: "water"            # 水立方检测标签 (20 类里无 cube, 默认水容器; 实车识别为其他类改这里)
      # 2026-08-04 实测: 在 pick_pose init 姿态 (x=-150, y=-150, arm=90, hand=-10)
      # 下, 水方块 bbox 中心在 cam2 画面 (0.0875, -0.236), 5 帧锁死. 换 cam2 安装位
      # 或换车体必须重测 (放水方块在 x=-150 正下方, 跑
      # `curl -X POST -H "Content-Type: application/json" -d '{}' http://<JETSON_IP>:5050/v1/vision/task`).
      # 2026-08-06: 20 帧锁死实测均值 (cx=0.063, cy=-0.202), 抖动 < 2px
      setpoint_cxcy: [0.098, -0.398]  # cam2 安装偏移 (label=water 标定, [-1, +1] 中心化); 2026-08-08 重测 → (cx=0.098, cy=-0.398)
      servo_y_mm: -150          # 视觉伺服起始 Y (与 pick_pose.y_transition_mm 对齐)
      grasp_y_mm: -50           # 吸附高度 (2026-08-04: -75 → -50, 抓时更贴方块)
      descend_hand_deg: 0       # 2026-08-04: 下降到位后手爪转 0° (吸嘴朝下贴方块顶面)
      timeout: 5.0              # 2026-08-09: 4.0 → 5.0 (第 1 块默认; 第 2 块 override 6s, 第 3 块 override 7s)
      hz: 25.0                  # 2026-08-06: 20 → 25 (闭环频率↑, 同样帧数收敛更快)
      # 2026-08-06: 提速放宽标准 (对齐时间太久)
      gain_arm: 0.15            # 2026-08-10: 0.3 → 0.15 (用户: 大臂增量再减半, 每帧 +0.3×dx → +0.15×dx)
      gain_x: 0.25              # 2026-08-09: 0.35 → 0.25 (x 十字速度增益调缓, 防超调/抖动)
      deadzone: 0.05            # 2026-08-09: 0.04 → 0.05 (所有水立方统一放宽, 更容易锁上)
      max_vel: 0.03             # 2026-08-08: 0.05 → 0.03 (视觉对齐 x 十字速度, 30mm/s 上限)
      # sign_arm: 沿用 +1 (task1 标定), 但 task2 arm_start=+95° 与 task1 的 -90°
      # 几何相反, 若水立方在 cam2 里被推向画面边缘, 改 -1.
      sign_arm: 1
      # 2026-08-04: task2 的 servo_y_mm=-120, 相机几何与 task1 的 y=-180 相反;
      # 实测目标在画面上方时 x 往反方向走 (目标飞出 cam2 FOV), 反转.
      sign_x: 1                 # dy>0 → x 往右; 跟 task1 标定值相反
      arm_min: 60               # 大臂 +95° ±35° clamp; 给 PID 足够余量
      arm_max: 130              # 大臂 +95° ±35° clamp
      settle_hits: 6            # 2026-08-08: 4 → 6 (连续 6 帧死区即锁)
      hold_s: 0.0               # 2026-08-06: 0.05 → 0.02 → 0.0 (grasp 后立即抬, 不 sleep)

    carry_pose:
      x_mm: -90                 # 2026-08-08: -95 → -90 (投放位伸出)
      arm_angle_deg: -96        # 2026-08-08: -92 → -96 (对标 detection 大臂角度)
      hand_angle_deg: -90

    v_max_arm_x_mms: 80

    vacuum_settle_s: 0.0            # 2026-08-06: 0.5 → 0.2 → 0.0 (删除 sleep, grasp 后立即下一步)
    chassis_move_timeout_s: 30

  # task1 结束后 (orchestrator 层): 清零里程 → 切断巡线视觉 → 直行 → 里程计 θ 转 45° → 恢复视觉 → 继续巡线
  # 盲转段不依赖 lane, stop_lane_feed 让 lane_state 失效, 转完再恢复并等新鲜 (防 watchdog 误急停).
  post_task1:
    enabled: true
    straight_m: 0.09        # 直行距离 (m, move_for 里程计闭环)
    turn_deg: -45.0         # 原地里程计 θ 转弯角度 (度, OdomTurnPID); 实车方向反了取负

  # task6 结束后 (orchestrator 层): 清零里程 → 切断巡线视觉 → 直行 → 里程计 θ 顺时针转 120° → 恢复视觉 → 继续巡线
  # 读订单后掉头去 task7 投放. θ 增=逆时针, 所以顺时针 120° = -120; 实车方向反了再取正.
  post_task6:
    enabled: true
    straight_m: 0.63        # 直行距离 (m, move_for 里程计闭环, 2026-08-08: 0.2 → 0.63)
    turn_deg: -120.0        # 顺时针 120° (度, OdomTurnPID)

# 8 任务 + 1 终点 waypoint 编排配置 (main.start.orchestrator 用).
# 触发条件: IR (红外接近) + dis_at_least_m (累计里程计) AND/OR.
# 换场地改这里, 业务代码不动.
#
# 十字路口弯声明 (main.chassis.loops.closed_loop 用):
#   第几个转弯的出口紧接着十字路口 = 那个弯用加固转弯逻辑
#   (里程碑窗口出口判定 + 触发后冷却), 其余弯走原版单帧判定.
#   None/删掉 = 所有弯道原版. 2026-08-05: 第 2 个弯是 45° 弯出口接十字路口.
crossroad_turn: 0

waypoints:

  # ----- task1 -----
  - name: task1_seeding
    task_id: 1
    task_module: main.task.task1_seeding
    ir_threshold_m: 1.2
    ir_side: right
    dis_at_least_m: 0.5
    trigger_op: AND

  # ----- task3 (TODO) -----
  - name: task3_pest_scout
    task_id: 3
    task_module: main.task.task3_pest_scout
    ir_threshold_m: 1.05
    ir_side: left
    dis_at_least_m: 0.93
    trigger_op: AND

  # ----- task2 -----
  - name: task2_water_tower
    task_id: 2
    task_module: main.task.task2_water_tower
    ir_side: both                 # 2026-08-06: 两侧 IR 都到位才触发
    ir_threshold_m: null          # 不设共用阈值, 走 per-side
    ir_threshold_left_m: 0.40     # 左 IR: 0.4m 内触发
    ir_threshold_right_m: 0.60    # 右 IR: 0.6m 内触发
    dis_at_least_m: null           # 2026-08-06: 不在基地开始测, dis 不参与触发
    trigger_op: AND              # ir_ok AND True = 只看 IR
    # 2026-08-06: 出弯后沿中心车道线直行 2.0s (走 move_along_lane, vy=0 + ω 锁对齐; 08-08 1.5→2.0),
    # 2026-08-09: 后退 0.2m 挪进 task2 init 跟臂切 detection 姿态并发 (进入任务点就动 X).
    settle_forward_s: 2.0        # 沿车道直行 2.0s (替代旧 settle_before_pause_s 的 time.sleep; 2026-08-08 1.5→2.0)
    settle_forward_speed_mps: 0.15
    back_off_delay_s: 0.0       # 2026-08-09: 后退已挪进 task2, 这里不再停
    back_off_m: 0.0              # 2026-08-09: 0.2 → 0 (挪进 task2 init, 见 water_tower_task.entry_back_off_m)
    back_off_speed_mps: 0.10    # 后退速度

  # ----- task3_shoot (2026-08-06 拆分, 跟在 task2 后面, 读识别 json + 射击) -----
  - name: task3_shoot
    task_id: 8
    task_module: main.task.task3_shoot
    # 触发靠 dis_at_least_m, IR 不参与 (跟 task1_ir 类似, 远距离触发靠 dis)
    # task2 结束后里程计清零 (orchestrator 显式 reset + dis_epoch), 该 dis 相对 task2 出口起算.
    ir_threshold_m: null
    ir_side: any
    dis_at_least_m: 2.70         # 相对 task2 出口: 里程计 distance=2.70m 时触发
    trigger_op: AND

  # ----- task4 -----
  - name: task4_harvest
    task_id: 4
    task_module: main.task.task4_harvest
    ir_threshold_m: 0.70
    ir_side: left
    dis_at_least_m: null
    trigger_op: AND

  # ----- task5 -----
  - name: task5_sort
    task_id: 5
    task_module: main.task.task5_sort
    ir_threshold_m: 0.15
    ir_side: left
    dis_at_least_m: 0
    trigger_op: AND

  # ----- task6 -----
  - name: task6_get_order
    task_id: 6
    task_module: main.task.task6_get_order
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 13.0
    trigger_op: OR

  # ----- task7 (TODO) -----
  - name: task7_deliver
    task_id: 7
    task_module: main.task.task7_deliver
    ir_threshold_m: 0.35
    ir_side: left
    dis_at_least_m: 0
    trigger_op: AND

  # ----- finish -----
