task_cfg:

  auto_seeding:
    _doc: |
      任务一:auto_seeding 自动移苗。
              右侧 S1/S2/S3 三个育苗筒 → 左侧 T1/T2/T3 三个种植槽。
              通过 cam2 视觉标签识别映射 (target_slot_map), 按 S1→S2→S3 顺序逐棵移栽。
              检测/复位姿态 X=-100mm, 大臂=-90°, 手爪=0°, Y=-100mm;
              抓取姿态 X=-100mm, Y=-10mm (大臂转 -90°+Y 下降);
              运输高度 Y=-150mm; 投放姿态 X=-270mm, 大臂=+90°, Y=-30mm.

    source_position_order: [1, 2, 3]

    target_slot_map:
      cylinder_3: 1
      cylinder_2: 2
      cylinder_1: 3

    spacing_along_row_m: 0.15

    arm_pick_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: 0              # 2026-08-02: 吸取动作位置 (吸嘴触底)
      hand_angle_deg: 0    # 吸取时末端向下

    arm_carry_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -100           # 上下输送时的中间高度 (现在 main loop 已不单独走, 留字段向后兼容)
      hand_angle_deg: -10

    arm_place_pose_T2:
      x_mm: -270
      arm_angle_deg: 90    # 大臂指向左侧
      y_mm: 0              # 2026-08-02: 释放动作位置 (吸嘴下到目标孔)
      hand_angle_deg: -10

    arm_return_S1_pose:
      x_mm: -100
      arm_angle_deg: -90
      y_mm: -100           # 回 S 姿态高度
      hand_angle_deg: -10

    init_y_mm: -100        # 初始化抬升高度 (扫描/伺服的起始高度)

    v_max_arm_lateral_mms: 60

    vacuum_settle_s: 0.5

    chassis_move_timeout_s: 30

  water_tower_task:
    _doc: |
      任务二：水塔取水
      左侧水立方（3 组 × 2 个），右侧 2 个水塔（间隔 60cm）
      Y: 0=底，负=上
      大臂: +90 = MID(init)，-90 = 抓取侧
      末端: -90 = UP(init)，0 = DOWN

    source_position_order: [1, 2]

    tower_spacing_m: 0.65
    group_forward_m: 0.32

    init_pose:
      y_mm: -150
      x_mm: 0
      arm_angle_deg: 90
      hand_angle_deg: -90

    detection_pose:
      x_mm: -240
      arm_angle_deg: -95
      hand_angle_deg: -60
      y_mm: -20

    first_cube_x_mm: -155
    second_cube_x_mm: -265

    pick_pose:
      y_transition_mm: -120
      y_descend_mm: -75
      y_lift_mm: -150
      arm_angle_deg: 95
      hand_angle_deg: 0

    carry_pose:
      x_mm: -105
      arm_angle_deg: -95
      hand_angle_deg: -90

    v_max_arm_x_mms: 80

    vacuum_settle_s: 0.5
    chassis_move_timeout_s: 30

# 8 任务 + 1 终点 waypoint 编排配置 (main.start.orchestrator 用).
# 触发条件: IR (红外接近) + dis_at_least_m (累计里程计) AND/OR.
# 换场地改这里, 业务代码不动.
waypoints:

  # ----- task1 -----
  - name: task1_seeding
    task_id: 1
    task_module: main.task.task1_seeding
    ir_threshold_m: 0.6
    ir_side: right
    dis_at_least_m: 0.90
    trigger_op: AND

  # ----- task3 (TODO) -----
  - name: task3_pest_scout
    task_id: 3
    task_module: main.task.task3_pest_scout
    ir_threshold_m: 2.00
    ir_side: left
    dis_at_least_m: 2.33
    trigger_op: AND

  # ----- task2 -----
  - name: task2_water_tower
    task_id: 2
    task_module: main.task.task2_water_tower
    ir_threshold_m: 0.70
    ir_side: right
    dis_at_least_m: 4.05
    trigger_op: AND

  # ----- task4 -----
  - name: task4_harvest
    task_id: 4
    task_module: main.task.task4_harvest
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 9.00
    trigger_op: AND

  # ----- task5 -----
  - name: task5_sort
    task_id: 5
    task_module: main.task.task5_sort
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 11.0
    trigger_op: AND

  # ----- task6 -----
  - name: task6_get_order
    task_id: 6
    task_module: main.task.task6_get_order
    ir_threshold_m: 0.50
    ir_side: left
    dis_at_least_m: 13.0
    trigger_op: AND

  # ----- task7 (TODO) -----
  - name: task7_deliver
    task_id: 7
    task_module: main.task.task7_deliver
    ir_threshold_m: 0.50
    ir_side: right
    dis_at_least_m: 14.5
    trigger_op: AND

  # ----- finish -----
  - name: cruise_done
    task_module: null
    ir_threshold_m: null
    dis_at_least_m: 16.5
    is_finish: true
